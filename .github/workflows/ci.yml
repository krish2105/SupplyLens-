name: ci
on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"          # weekly: dependency advisories change without a commit
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      - name: lockfile matches pyproject
        run: uv lock --check
      - name: hosted API dependency pins match uv.lock
        run: python3 scripts/vercel/build_api.py --check
      - name: ruff (correctness, imports, bugbear, security rules)
        run: uv run ruff check .

  secrets-and-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }          # gitleaks scans history, not only the tip
      - name: secret scan (gitleaks, full history)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -   # pinned release checksum
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --config .gitleaks.toml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Python dependency advisories (pip-audit against the locked set)
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-emit-workspace | sed 's/+cpu//' > /tmp/requirements.txt   # torch's local version tag is not a PyPI version
          uvx pip-audit==2.10.1 --requirement /tmp/requirements.txt --no-deps --disable-pip --strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - name: JavaScript dependency advisories (production tree, high and above)
        run: npm --prefix apps/web audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      - name: databases and roles
        run: |
          psql -c "CREATE ROLE supplylens_owner LOGIN PASSWORD 'supplylens_owner_dev'" -c "CREATE ROLE supplylens_app LOGIN PASSWORD 'supplylens_app_dev' NOBYPASSRLS"
          psql -c "CREATE DATABASE supplylens_test OWNER supplylens_owner"
          psql -d supplylens_test -c "CREATE EXTENSION vector" -c "GRANT CONNECT ON DATABASE supplylens_test TO supplylens_app"
          SUPPLYLENS_MIGRATION_URL=postgresql+psycopg://supplylens_owner:supplylens_owner_dev@localhost:5432/supplylens_test uv run alembic -c services/api/alembic.ini upgrade head
      - name: unit, integration, security-matrix, contract and BUS-020 rehearsal tests
        run: uv run pytest -q --junitxml=artifacts/reports/pytest-junit.xml
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: pytest-junit, path: artifacts/reports/pytest-junit.xml, if-no-files-found: ignore }

  contracts-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - run: uv sync --frozen && npm --prefix apps/web ci
      - name: API schema, generated types and web client agree
        run: ./scripts/check_contracts.sh
      - name: typecheck (app and browser tests)
        run: npm --prefix apps/web run typecheck
      - name: ESLint (Next.js core web vitals, React hooks, TypeScript; zero warnings)
        run: npm --prefix apps/web run lint
      - name: unit and component tests (Vitest)
        run: npm --prefix apps/web test
      - run: cd apps/web && NEXT_DIST_DIR=.next-build npx next build

  e2e:
    needs: [backend, contracts-and-web]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      SUPPLYLENS_DATABASE_URL: postgresql+psycopg://supplylens_app:supplylens_app_dev@localhost:5432/supplylens
      SUPPLYLENS_ADMIN_DATABASE_URL: postgresql+psycopg://supplylens_owner:supplylens_owner_dev@localhost:5432/supplylens
      SUPPLYLENS_MIGRATION_URL: postgresql+psycopg://supplylens_owner:supplylens_owner_dev@localhost:5432/supplylens
      # This job's stack is disposable: the browser suite may cancel its own test orders (apps/web/e2e/disposable.ts)
      SUPPLYLENS_E2E_DISPOSABLE: "true"
      SUPPLYLENS_E2E_ALLOW_DESTRUCTIVE: "1"
      SUPPLYLENS_SIGN_IN_PER_MINUTE: "100000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - run: uv sync --frozen && npm --prefix apps/web ci
      - name: database, migrations, workspaces and the synthetic browser-test fixture
        run: |
          psql -c "CREATE ROLE supplylens_owner LOGIN PASSWORD 'supplylens_owner_dev'" -c "CREATE ROLE supplylens_app LOGIN PASSWORD 'supplylens_app_dev' NOBYPASSRLS"
          psql -c "CREATE DATABASE supplylens OWNER supplylens_owner"
          psql -d supplylens -c "CREATE EXTENSION vector" -c "GRANT CONNECT ON DATABASE supplylens TO supplylens_app"
          uv run alembic -c services/api/alembic.ini upgrade head
          uv run python -m supplylens.bootstrap        # workspaces, dev accounts and the fictional Demo workspace (UCI step skips: no licensed file)
          uv run python scripts/seed_e2e_fixture.py
      - name: start API, worker and web
        run: |
          nohup uv run uvicorn supplylens.api.app:app --port 8000 > api.log 2>&1 &
          nohup uv run python -m supplylens_worker.main > worker.log 2>&1 &
          (cd apps/web && NEXT_DIST_DIR=.next-build npx next build && NEXT_DIST_DIR=.next-build nohup npx next start --port 3100 > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -fsS http://localhost:3100/login >/dev/null && curl -fsS http://localhost:8000/api/v1/auth/dev-users >/dev/null && exit 0; sleep 2; done
          cat api.log web.log; exit 1
      - name: browsers (Chromium, Firefox, WebKit)
        run: cd apps/web && ../../scripts/ci_annotate.sh npx playwright install --with-deps chromium firefox webkit
      # Screenshot regression first, on the freshly seeded stack, before any suite changes data. Baselines are per platform
      # and reviewed by eye before they are committed; until Linux ones exist the run records them for review, compares nothing.
      - name: screenshot regression (critical screens, light and dark, desktop and phone)
        run: |
          cd apps/web
          if ls e2e/visual.spec.ts-snapshots/*-linux.png >/dev/null 2>&1; then
            ../../scripts/ci_annotate.sh npx playwright test --project visual --reporter=list --output test-results-visual
          else
            echo "::warning::No Linux visual baselines are committed: screenshots recorded for review (artifact visual-baselines-linux), not compared."
            npx playwright test --project visual --reporter=list --output test-results-visual --update-snapshots=missing
          fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines-linux
          path: |
            apps/web/e2e/visual.spec.ts-snapshots/*-linux.png
            apps/web/test-results-visual
          if-no-files-found: ignore
      - name: end-to-end, resilience, accessibility and Web Vitals suites (Chromium desktop and mobile; journeys on Firefox, WebKit, iPhone-sized WebKit)
        run: cd apps/web && ../../scripts/ci_annotate.sh npx playwright test --project desktop --project mobile --project firefox --project webkit --project mobile-safari
      # Lab Web Vitals alone and one at a time, after the other suites: beside them they measured the runner's load (QA-4B-01).
      # Targets unchanged (LCP 2.5 s, INP 200 ms, CLS 0.1 desktop; stress budgets on the throttled phone profile).
      - name: lab Web Vitals (alone, one test at a time)
        if: success() || failure()
        env: { E2E_JSON: ../../artifacts/reports/e2e-vitals-results.json }
        run: cd apps/web && ../../scripts/ci_annotate.sh npx playwright test --project vitals-desktop --project vitals-mobile --workers 1 --output test-results-vitals
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-reports
          path: |
            artifacts/reports/e2e-results.json
            artifacts/reports/e2e-vitals-results.json
            apps/web/playwright-report
            apps/web/test-results-vitals
            apps/web/test-results
            artifacts/reports/webvitals
            artifacts/reports/a11y-tree
            api.log
            worker.log
            web.log
          if-no-files-found: ignore

  pitr-drill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      - name: PostgreSQL server binaries with pgvector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-contrib postgresql-16-pgvector
          sudo systemctl stop postgresql
          echo "PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: point-in-time recovery drill (ARC-06, BUS-014, BUS-020)
        run: ./scripts/ci_annotate.sh ./scripts/pitr_drill.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: pitr-report, path: artifacts/reports/pitr_drill_*.json, if-no-files-found: ignore }

  compose-smoke:
    needs: [backend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build and start the full stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 120); do
            curl -fsS http://localhost:8000/api/v1/auth/dev-users >/dev/null 2>&1 && curl -fsSL -o /dev/null http://localhost:3100/login 2>&1 && exit 0
            sleep 5
          done
          docker compose ps; exit 1
      - name: sign in and read through the API
        run: |
          curl -fsS http://localhost:8000/api/v1/auth/dev-users
          curl -fsS -c /tmp/cj -H 'Content-Type: application/json' -H 'X-Requested-With: supplylens' -X POST http://localhost:8000/api/v1/auth/dev-login -d '{"email":"approver@dev.supplylens.local"}'
          curl -fsS -b /tmp/cj -H 'X-SupplyLens-Tenant: demo' http://localhost:8000/api/v1/overview
      - if: failure()
        run: docker compose logs --no-color | tail -n 300
      - if: always()
        run: docker compose down -v

  # S19: every acceptance criterion linked to this run's own test results (commit, run id, run URL).
  acceptance-evidence:
    needs: [backend, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: pytest-junit, path: artifacts/reports }
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: e2e-reports, path: . }
        continue-on-error: true
      - name: link acceptance criteria to this run's results
        run: python3 scripts/acceptance_evidence.py --junit artifacts/reports/pytest-junit.xml --playwright artifacts/reports/e2e-results.json artifacts/reports/e2e-vitals-results.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-evidence
          path: |
            artifacts/reports/acceptance_evidence.json
            artifacts/reports/acceptance_evidence.md
