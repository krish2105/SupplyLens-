# Dependency update proposals (Phase 2, NIST SSDF PW.4 / RV.1). CI pins actions to commit SHAs; Dependabot proposes the
# new SHA with its release tag, so pins stay reviewable instead of drifting silently.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
