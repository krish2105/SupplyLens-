[project]
name = "supplylens"
version = "0.1.0"
description = "SupplyLens: evidence-grounded inventory and procurement decisions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]>=3.2",
  "pgvector",
  "pandas",
  "pyarrow",
  "openpyxl",
  "numpy",
  "ortools",
  "lightgbm",
  "torch",
  "langgraph",
  "httpx",
  "python-multipart",
  "itsdangerous",
]

[dependency-groups]
dev = ["pytest", "pytest-timeout", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "services/api/src/supplylens",
  "services/worker/src/supplylens_worker",
  "ml/supplylens_ml",
  "optimisation/supplylens_opt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300

[tool.ruff]
line-length = 100

# Containers run on Linux CPU: use PyTorch's CPU wheels there (no CUDA libraries); macOS keeps the default wheel (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
