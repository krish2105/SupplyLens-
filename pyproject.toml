[project]
name = "supplylens"
version = "0.1.0"
description = "SupplyLens: evidence-grounded inventory and procurement decisions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]>=3.2",
  "pgvector",
  "pandas",
  "pyarrow",
  "openpyxl",
  "numpy",
  "ortools",
  "lightgbm",
  "torch",
  "langgraph",
  "httpx",
  "python-multipart",
  "itsdangerous",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-instrumentation-httpx",
]

[dependency-groups]
dev = ["pytest", "pytest-timeout", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "services/api/src/supplylens",
  "services/worker/src/supplylens_worker",
  "ml/supplylens_ml",
  "optimisation/supplylens_opt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Correctness (E4/E7/E9/F), import order, modern syntax, likely bugs, unused noqa. Style-only rules stay off:
# E501 (long lines) is not enforced. B008 is ignored because FastAPI declares dependencies as call defaults.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100"]
ignore = ["B008", "E741", "E702"]   # E741/E702: existing cosmetic style (single-letter loop names, one-line pairs)

[tool.ruff.lint.isort]
known-first-party = ["supplylens", "supplylens_ml", "supplylens_opt", "supplylens_worker"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "E402"]
"evaluations/*" = ["E402"]

# Containers run on Linux CPU: use PyTorch's CPU wheels there (no CUDA libraries); macOS keeps the default wheel (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
